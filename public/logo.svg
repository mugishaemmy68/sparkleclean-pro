<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8965A"/>
      <stop offset="100%" style="stop-color:#B07D45"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D4F4F"/>
      <stop offset="100%" style="stop-color:#1A6B6B"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#emerald-grad)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#C8965A" stroke-width="1" opacity="0.3"/>

  <!-- Sparkle icon -->
  <g transform="translate(200,145)" fill="#C8965A">
    <!-- Center star -->
    <polygon points="0,-28 6,-8 28,-8 10,4 16,24 0,12 -16,24 -10,4 -28,-8 -6,-8" opacity="0.9"/>
    <!-- Small sparkles -->
    <circle cx="-35" cy="-20" r="3" opacity="0.5"/>
    <circle cx="38" cy="-15" r="2.5" opacity="0.4"/>
    <circle cx="25" cy="30" r="2" opacity="0.3"/>
    <circle cx="-30" cy="25" r="2" opacity="0.35"/>
  </g>

  <!-- Text: SparkleClean -->
  <text x="200" y="225" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="38" font-weight="bold" fill="white" letter-spacing="1">SparkleClean</text>

  <!-- Text: PRO -->
  <text x="200" y="260" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#C8965A" letter-spacing="8">PRO</text>

  <!-- Tagline -->
  <line x1="120" y1="280" x2="280" y2="280" stroke="#C8965A" stroke-width="0.5" opacity="0.4"/>
  <text x="200" y="305" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="white" opacity="0.5" letter-spacing="3">EDMONTON, AB</text>
</svg>
