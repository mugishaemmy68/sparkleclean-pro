<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D4F4F"/>
      <stop offset="100%" style="stop-color:#1A6B6B"/>
    </linearGradient>
    <linearGradient id="gold-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8965A"/>
      <stop offset="100%" style="stop-color:#D4A96E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="312" fill="url(#bg-grad)"/>

  <!-- Decorative circles -->
  <circle cx="720" cy="50" r="180" fill="#1A6B6B" opacity="0.3"/>
  <circle cx="100" cy="280" r="150" fill="#C8965A" opacity="0.04"/>
  <circle cx="650" cy="250" r="100" fill="#C8965A" opacity="0.06"/>

  <!-- Decorative ring -->
  <circle cx="700" cy="156" r="120" fill="none" stroke="white" stroke-width="0.5" opacity="0.06"/>
  <circle cx="700" cy="156" r="160" fill="none" stroke="white" stroke-width="0.3" opacity="0.04"/>

  <!-- Gold accent line -->
  <line x1="60" y1="190" x2="60" y2="260" stroke="#C8965A" stroke-width="3" opacity="0.6" stroke-linecap="round"/>

  <!-- Sparkle icon -->
  <g transform="translate(105, 90)" fill="#C8965A" opacity="0.8">
    <polygon points="0,-18 4,-5 18,-5 7,3 11,16 0,8 -11,16 -7,3 -18,-5 -4,-5"/>
  </g>

  <!-- Main text -->
  <text x="80" y="140" font-family="Georgia, 'Playfair Display', serif" font-size="48" font-weight="bold" fill="white" letter-spacing="1">SparkleClean</text>
  <text x="405" y="140" font-family="Georgia, 'Playfair Display', serif" font-size="48" font-weight="bold" fill="#C8965A" font-style="italic" letter-spacing="1"> Pro</text>

  <!-- Tagline -->
  <text x="80" y="175" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="white" opacity="0.6" letter-spacing="1">Premium Cleaning &amp; Snow Removal</text>

  <!-- Service badges -->
  <g transform="translate(80, 210)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="white" opacity="0.08"/>
    <text x="65" y="20" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="white" opacity="0.7" letter-spacing="1">RESIDENTIAL</text>
  </g>
  <g transform="translate(220, 210)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="white" opacity="0.08"/>
    <text x="65" y="20" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="white" opacity="0.7" letter-spacing="1">COMMERCIAL</text>
  </g>
  <g transform="translate(360, 210)">
    <rect x="0" y="0" width="145" height="30" rx="15" fill="#C8965A" opacity="0.2"/>
    <text x="72" y="20" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#C8965A" letter-spacing="1">SNOW REMOVAL</text>
  </g>

  <!-- Bottom info -->
  <text x="80" y="285" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="white" opacity="0.35" letter-spacing="2">EDMONTON, ALBERTA  |  (780) 884-7305  |  BONDED &amp; INSURED  |  ECO-FRIENDLY</text>
</svg>
